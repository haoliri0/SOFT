name: symft-branch-checks

on:
  push:
    branches: [symft]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-and-docs:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        simd: ["ON", "OFF"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure portable CPU build
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DSYMFT_CPP_ENABLE_CUDA=OFF -DSYMFT_CPP_NATIVE=OFF
          -DSYMFT_CPP_ENABLE_AVX2=${{ matrix.simd }}
          -DSYMFT_CPP_ENABLE_AVX512=${{ matrix.simd }}
          -DSYMFT_CPP_BUILD_VALIDATION_TOOLS=ON
      - run: cmake --build build -j 2
      - run: ctest --test-dir build --output-on-failure
      - name: Build this checkout's CPU Python package
        env:
          SYMFT_PY_NATIVE: "0"
          SYMFT_PY_ENABLE_CUDA: "0"
        run: |
          python -m pip install numpy setuptools wheel
          python -m pip install ./python --no-build-isolation
      - run: python -m unittest discover -s python/tests -v
      - name: Validate persistent worker and journal behavior
        env:
          SYMFT_TEST_WORKER: ${{ github.workspace }}/build/cpp/symft_cpu_stream_worker
        run: python -m unittest discover -s benchmark/validation -p 'test_*.py' -v
      - run: python tools/check_documentation.py
